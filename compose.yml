# Local Demo database only. Do not reuse these credentials in production.
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: qwenpaw-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: qwenpaw
      POSTGRES_USER: qwenpaw
      POSTGRES_PASSWORD: qwenpaw_dev_password
    ports:
      - "5432:5432"
    volumes:
      - qwenpaw_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qwenpaw -d qwenpaw"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  qwenpaw_postgres_data:
